<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="data:,">
        <title>Brave</title>
    </head>
    <body>
    <header>
        <nav class="container-fluid">
            <div class="row justify-content-between align-items-center">
                <div class="col-sm-4">
                    <h1>BRAVE</h1>
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-info dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-plus"></i> Add
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="new-input-button">Input</a></li>
                            <li><a class="dropdown-item" href="#" id="new-mixer-button">Mixer</a></li>
                            <li><a class="dropdown-item" href="#" id="new-output-button">Output</a></li>
                            <li><a class="dropdown-item" href="#" id="new-overlay-button">Overlay</a></li>
                        </ul>
                    </div>
                    <div class="btn-group ms-2">
                        <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-cog"></i> Options
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="restart-brave-button">Restart Brave</a></li>
                            <li><a class="dropdown-item" href="api/config/current.yaml">Download current config</a></li>
                            <li><a class="dropdown-item" href="#" id="refresh-page-button">Refresh page</a></li>
                            <li><a class="dropdown-item" target="_blank" href="elements_table">Debug view (GStreamer elements)</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-sm-4 text-center">
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-info dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-tv"></i>&nbsp;&nbsp; <span id="preview-button-msg">No preview</span>
                        </button>
                        <ul class="dropdown-menu" id="preview-bar-dropdown"></ul>
                    </div>
                    <span id="mute-span"></span>
                </div>
                <div class="col-sm-4 text-end" id="cpu-stats">
                </div>
            </div>
        </nav>
    </header>
    <main class="container-fluid">
        <div id="preview-bar"></div>

        <div class="container-fluid">
            <div class="row" id="cards"></div>
        </div>

        <div style="clear:both"></div>

        <!-- Primary Modal (for adding and editing things) -->
        <div class="modal fade" id="primary-modal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body"></div>
                    <div class="modal-footer"></div>
                </div>
            </div>
        </div>

        <div id="top-message" class="alert alert-warning alert-dismissible fade show" role="alert" style="display: none;">
            <div></div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script type="module" src="js/index.js"></script>
    </main>
    </body>
</html>
